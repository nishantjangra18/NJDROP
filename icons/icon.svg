<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="nGrad" x1="10" y1="20" x2="55" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset="0.4" stop-color="#4FC3FF"/>
      <stop offset="1" stop-color="#2447C9"/>
    </linearGradient>
    <linearGradient id="jGrad" x1="45" y1="18" x2="88" y2="78" gradientUnits="userSpaceOnUse">
